[project]
name = "core-ultra"
version = "0.0.1"
description = "Pre-alpha in which a trained scene model writes an interface as a scene that deterministic code draws."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.5",
    "psutil>=7.2.2",
    "pyside6-essentials>=6.12.0",
    "torch>=2.15.0",
]

[project.scripts]
core-ultra = "core_ultra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_ultra"]

[tool.uv]
# Tested platform is macOS on Apple silicon; no cross-platform claim is made,
# so the lock is resolved for that platform only.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
